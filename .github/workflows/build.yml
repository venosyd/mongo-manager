name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev

      - name: Testes
        # O alvo Intel é compilado cruzado no runner ARM, então só os demais rodam testes.
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empacotar
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          name="mongo-manager-${version}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/mongo-manager"
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              mkdir -p "pkg/$name"
              cp "$bin.exe" README.md LICENSE "pkg/$name/"
              (cd pkg && 7z a "../dist/$name.zip" "$name" > /dev/null)
              ;;
            macOS)
              app="pkg/Mongo Manager.app"
              mkdir -p "$app/Contents/MacOS"
              cp "$bin" "$app/Contents/MacOS/mongo-manager"
              cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Mongo Manager</string>
            <key>CFBundleDisplayName</key><string>Mongo Manager</string>
            <key>CFBundleIdentifier</key><string>com.venosyd.mongo-manager</string>
            <key>CFBundleExecutable</key><string>mongo-manager</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
              cp README.md LICENSE pkg/
              (cd pkg && zip -qry "../dist/$name.zip" "Mongo Manager.app" README.md LICENSE)
              ;;
            *)
              mkdir -p "pkg/$name"
              cp "$bin" README.md LICENSE "pkg/$name/"
              tar -czf "dist/$name.tar.gz" -C pkg "$name"
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mongo-manager-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
