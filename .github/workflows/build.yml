name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev

      - name: Instalar cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Testes
        # O alvo Intel é compilado cruzado no runner ARM, então só os demais rodam testes.
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empacotar e gerar instalador
        shell: bash
        env:
          # Impede o Git Bash de converter "/DAppVersion=..." em caminho de arquivo.
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          base="mongo-manager-${version}-${{ matrix.label }}"
          bin="target/${{ matrix.target }}/release/mongo-manager"
          mkdir -p dist pkg
          case "${{ runner.os }}" in
            Windows)
              # Versão portátil
              mkdir -p "pkg/mongo-manager"
              cp "$bin.exe" README.md "pkg/mongo-manager/"
              cp LICENSE "pkg/mongo-manager/LICENSE.txt"
              (cd pkg && 7z a "../dist/${base}-portable.zip" mongo-manager > /dev/null)
              # Instalador (Inno Setup)
              iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
              if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress; fi
              "$iscc" /Q "/DAppVersion=${version}" packaging/windows/mongo-manager.iss
              ;;
            macOS)
              app="pkg/Mongo Manager.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$bin" "$app/Contents/MacOS/mongo-manager"
              sed "s/VERSION/${version}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
              iconset="pkg/AppIcon.iconset"
              mkdir -p "$iconset"
              for s in 16 32 128 256 512; do
                sips -z $s $s assets/icon-1024.png --out "$iconset/icon_${s}x${s}.png" > /dev/null
                sips -z $((s * 2)) $((s * 2)) assets/icon-1024.png --out "$iconset/icon_${s}x${s}@2x.png" > /dev/null
              done
              iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
              # Assinatura ad-hoc (sem certificado): exigida para binários ARM.
              codesign --force --deep --sign - "$app"
              # Imagem de disco com atalho para Aplicativos
              mkdir -p pkg/dmg
              cp -R "$app" pkg/dmg/
              ln -s /Applications pkg/dmg/Applications
              for i in 1 2 3; do
                hdiutil create -volname "Mongo Manager" -srcfolder pkg/dmg -ov -format UDZO "dist/${base}.dmg" && break
                sleep 5
              done
              test -f "dist/${base}.dmg"
              ;;
            Linux)
              # Versão portátil
              mkdir -p "pkg/mongo-manager"
              cp "$bin" README.md LICENSE "pkg/mongo-manager/"
              tar -czf "dist/${base}.tar.gz" -C pkg mongo-manager
              # Pacote .deb (Debian/Ubuntu)
              cargo deb --no-build --target ${{ matrix.target }}
              cp target/${{ matrix.target }}/debian/*.deb dist/
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mongo-manager-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Sistema | Instalador | Portátil |
            | --- | --- | --- |
            | Windows 10/11 (x64) | `*-windows-x64-setup.exe` | `*-windows-x64-portable.zip` |
            | macOS Apple Silicon (M1/M2/M3…) | `*-macos-apple-silicon.dmg` | — |
            | macOS Intel | `*-macos-intel.dmg` | — |
            | Debian / Ubuntu (x64) | `*_amd64.deb` | `*-linux-x64.tar.gz` |

            **macOS:** o app não é assinado com certificado da Apple. Na primeira vez, clique com o botão
            direito em *Mongo Manager* → **Abrir**, ou rode
            `xattr -dr com.apple.quarantine "/Applications/Mongo Manager.app"`.

            **Windows:** o instalador não é assinado; se o SmartScreen avisar, clique em
            *Mais informações* → **Executar assim mesmo**.
