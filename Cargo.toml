[package]
name = "mongo-manager"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/venosyd/mongo-manager"

[dependencies]
bson = { version = "2", features = ["chrono-0_4", "uuid-1"] }
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.37", features = ["serde"] }
futures-util = "0.3.34"
mongodb = { version = "~3.2", features = ["zlib-compression", "snappy-compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
uuid = { version = "1.29.0", features = ["v4"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
png = "0.18.1"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
