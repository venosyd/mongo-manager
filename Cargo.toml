[package]
name = "mongo-manager"
version = "0.1.1"
edition = "2024"
description = "Gerenciador de bancos MongoDB em Rust"
authors = ["Venosyd"]
license = "MIT"
repository = "https://github.com/venosyd/mongo-manager"

[dependencies]
bson = { version = "2", features = ["chrono-0_4", "uuid-1"] }
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.37", features = ["serde"] }
futures-util = "0.3.34"
# 3.0.x é a última série do driver que conecta no MongoDB 3.6 (as seguintes exigem 4.0+).
mongodb = { version = "=3.0.1", features = ["zlib-compression", "snappy-compression"] }
# O driver 3.0.1 só compila com as macros internas da mesma versão.
mongodb-internal-macros = "=3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
uuid = { version = "1.29.0", features = ["v4"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
png = "0.18.1"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "Venosyd"
copyright = "2026, Venosyd"
section = "database"
extended-description = "Gerenciador de bancos MongoDB: tabela com colunas redimensionáveis, ordenação por coluna, navegação até o fim da coleção e autocomplete em consultas e agregações."
depends = "$auto"
assets = [
    ["target/release/mongo-manager", "usr/bin/", "755"],
    ["packaging/linux/mongo-manager.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/mongo-manager.png", "644"],
    ["README.md", "usr/share/doc/mongo-manager/README.md", "644"],
]
